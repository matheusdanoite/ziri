name: ZiriApp
options:
  bundleIdPrefix: fi.ziri
  deploymentTarget:
    iOS: "27.0"
packages:
  ZiriCore:
    path: .
targets:
  ZiriApp:
    type: application
    platform: iOS
    sources: [ZiriApp/Sources]
    dependencies:
      - package: ZiriCore
        product: ZiriCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.ziri.app
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ZiriApp/Info.plist
        CODE_SIGN_STYLE: Automatic
