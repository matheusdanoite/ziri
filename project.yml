name: ZiriApp
options:
  bundleIdPrefix: fi.ziri
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
packages:
  ZiriCore:
    path: .
# Time e prefixo de bundle id vêm de Config/Local.xcconfig (ver Config/ziri.xcconfig).
# Não declare DEVELOPMENT_TEAM nos alvos: setting de alvo ganha do xcconfig.
configFiles:
  Debug: Config/ziri.xcconfig
  Release: Config/ziri.xcconfig
targets:
  ZiriApp:
    type: application
    platform: iOS
    # Só o iPhone indexa: a Siri do Mac recusa doações de apps fora da App Store.
    sources: [ZiriApp/Sources]
    dependencies:
      - package: ZiriCore
        product: ZiriCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZIRI_BUNDLE_PREFIX).app
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # Info.plist: chaves escalares ficam AQUI, arrays ficam no arquivo.
        #
        # Com GENERATE_INFOPLIST_FILE ligado, o painel Info do Xcode migra para
        # build settings toda chave que tem equivalente INFOPLIST_KEY_* e reescreve
        # o Info.plist sem ela. Se a chave só existir no .xcodeproj, o próximo
        # `xcodegen generate` a apaga — e sem NSLocalNetworkUsageDescription o
        # browse Bonjour volta a falhar com NoAuth(-65555), sem alerta nenhum.
        #
        # NSBonjourServices e CFBundleURLTypes são arrays: INFOPLIST_KEY_* só gera
        # string, e NSBonjourServices como string é ignorado pelo iOS. Esses ficam
        # em ZiriApp/Info.plist, onde o Xcode não mexe.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ZiriApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ziri
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "O ziri sincroniza seu histórico do WhatsApp direto do seu Mac, pela rede local. Nada sai da sua rede."
  ZiriMac:
    type: application
    platform: macOS
    # Agente do launchd sem interface: serve o WhatsApp deste Mac para o iPhone.
    # É um app, não o binário `ziri`, para ter identidade de assinatura estável
    # — é a ela que o macOS amarra a permissão de ler dados de outros apps.
    sources:
      - ZiriMac/Sources
      - path: ZiriMac/fi.ziri.mac.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: ZiriCore
        product: ZiriCore
    settings:
      base:
        PRODUCT_NAME: ziri
        # A permissão de acesso ao WhatsApp fica amarrada a bundle id +
        # certificado: mudar o prefixo pede a permissão de novo.
        PRODUCT_BUNDLE_IDENTIFIER: $(ZIRI_BUNDLE_PREFIX).mac
        MARKETING_VERSION: "0.2"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # O preset do XcodeGen assina ad-hoc ("-") no Mac, e assinatura ad-hoc
        # muda a cada build: a permissão concedida não sobreviveria.
        CODE_SIGN_IDENTITY: Apple Development
        # Sem App Sandbox: o ziri precisa ler o group container do WhatsApp.
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ziri
        # Sem ícone no Dock e sem menu: o executável nem sobe o AppKit.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
