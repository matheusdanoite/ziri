name: ZiriApp
options:
  bundleIdPrefix: fi.ziri
  deploymentTarget:
    iOS: "27.0"
packages:
  ZiriCore:
    path: .
targets:
  ZiriApp:
    type: application
    platform: iOS
    sources: [ZiriApp/Sources]
    dependencies:
      - package: ZiriCore
        product: ZiriCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.ziri.app
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ziri
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "O ziri sincroniza seu histórico do WhatsApp direto do seu Mac, pela rede local."
        INFOPLIST_KEY_NSBonjourServices: "_ziri._tcp"
        INFOPLIST_KEY_UIBackgroundModes: processing
        CODE_SIGN_STYLE: Automatic
